<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Pswdgen Extension</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #4a9eff;
    }
    .instructions {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .instructions h3 {
      margin-top: 0;
      color: #1976d2;
    }
    .instructions ul {
      margin: 10px 0;
      padding-left: 20px;
    }
    .instructions li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>🧪 Test Pswdgen Extension</h1>
  
  <div class="instructions">
    <h3>How to test:</h3>
    <ul>
      <li><strong>Popup:</strong> Click extension icon or press Ctrl+Shift+P</li>
      <li><strong>Context Menu:</strong> Right-click on any field below</li>
      <li><strong>Keyboard:</strong> Focus a field and press Ctrl+Shift+G</li>
      <li><strong>Insert:</strong> Generate in popup and click "Insert" button</li>
    </ul>
  </div>

  <form>
    <div class="form-group">
      <label for="password">Password Field:</label>
      <input type="password" id="password" placeholder="Right-click or use shortcuts">
    </div>

    <div class="form-group">
      <label for="text">Text Field:</label>
      <input type="text" id="text" placeholder="Right-click or use shortcuts">
    </div>

    <div class="form-group">
      <label for="email">Email Field:</label>
      <input type="email" id="email" placeholder="test@example.com">
    </div>

    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" placeholder="username">
    </div>

    <div class="form-group">
      <label for="pin">PIN Code:</label>
      <input type="text" id="pin" placeholder="Enter PIN" maxlength="8">
    </div>

    <div class="form-group">
      <label for="notes">Notes (Textarea):</label>
      <textarea id="notes" rows="4" placeholder="Right-click here too"></textarea>
    </div>

    <div class="form-group">
      <label>ContentEditable Div:</label>
      <div contenteditable="true" style="border: 2px solid #ddd; padding: 10px; border-radius: 4px; min-height: 60px;">
        Click here and try to insert password
      </div>
    </div>
  </form>

  <script>
    // Log when fields are focused
    document.querySelectorAll('input, textarea, [contenteditable]').forEach(el => {
      el.addEventListener('focus', () => {
        console.log('Focused:', el.id || el.tagName);
      });
    });
  </script>
</body>
</html>
