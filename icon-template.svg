<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue background with rounded corners -->
  <rect width="128" height="128" rx="24" fill="#4a9eff"/>
  
  <!-- Lock icon (simplified) -->
  <g transform="translate(32, 28)">
    <!-- Lock body -->
    <rect x="8" y="32" width="48" height="40" rx="4" fill="white"/>
    
    <!-- Lock shackle -->
    <path d="M 16 32 L 16 20 Q 16 8, 32 8 Q 48 8, 48 20 L 48 32" 
          stroke="white" 
          stroke-width="8" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Keyhole -->
    <circle cx="32" cy="48" r="6" fill="#4a9eff"/>
    <rect x="29" y="48" width="6" height="12" rx="2" fill="#4a9eff"/>
  </g>
</svg>
